[package]
name = "ordiff-desktop"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
libc = "0.2"

[profile.release]
# Rust 1.95's debuginfo stripping misaligns proc-macro dylibs on macOS 27.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"
lto = true
codegen-units = 1

[profile.release.build-override]
strip = "none"
